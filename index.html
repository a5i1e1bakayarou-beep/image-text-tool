<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>画像文字入力ツール</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app">
<header class="hero">
  <div><h1>画像文字入力ツール</h1><p>文字ごとに画像を登録して、画像ベースの文字組みを作ります♡</p></div>
  <div class="actions">
    <button id="exportBtn">画像込みでプロジェクトをZIP保存</button>
    <button id="importBtn">ZIPから復元</button><input id="importFile" type="file" accept=".zip" hidden>
    <button id="resetBtn" class="danger">保存データ削除</button>
  </div>
</header>

<section class="panel">
  <div class="sectionTitle"><h2>1. 文字と画像を登録</h2><button id="addChar">＋ 任意文字を追加</button></div>
  <div id="charGrid" class="charGrid"></div>
</section>

<section class="panel">
<h2>2. 画像・文字設定</h2>
<div class="settings">
<label>複数画像をランダム <input id="randomImage" type="checkbox"></label>
<label>画像サイズをランダム <input id="randomSize" type="checkbox"></label>
<label>文頭・ピリオド後を拡大 <input id="autoCap" type="checkbox"></label>
<label>登録時に規格統一 <input id="normalize" type="checkbox"></label>
<div>規格 <input id="normW" type="number" min="16" max="2048"> × <input id="normH" type="number" min="16" max="2048">
<select id="normMode"><option value="contain">収める</option><option value="cover">切り抜いて合わせる</option><option value="stretch">引き伸ばす</option></select></div>
<div>倍率 <input id="sizeMin" type="number" min="50" max="150">% ～ <input id="sizeMax" type="number" min="50" max="150">%</div>
<div class="rangeBox">文字間隔 <output id="spacingValue"></output><input id="spacing" type="range" min="-80" max="50"></div>
<button id="renorm">登録済み画像も規格を統一</button>
</div>
</section>

<section class="panel">
<h2>3. 文章を入力</h2>
<textarea id="text" rows="7" placeholder="ここに文章を入力…"></textarea>
<div class="actions">
<button id="copyText">文字列をコピー</button>
<button id="clearText">クリア</button>
<button id="reroll">表示を再生成</button>
<button id="savePng">画像として保存（PNG）</button><button id="printPdf">PDFとして保存</button>
</div>
</section>

<section class="panel"><h2>4. 文字入力キーボード</h2><div id="keyboard" class="keyboard"></div></section>

<section class="panel"><div class="sectionTitle"><h2>5. プレビュー</h2></div><div id="preview" class="preview"></div></section>
</main>

<div id="modal" class="modal hidden"><div class="modalCard">
<h3>任意文字を追加</h3><input id="newChar" maxlength="2" autofocus>
<div class="actions"><button id="cancelAdd">キャンセル</button><button id="okAdd">追加</button></div>
</div></div>

<div id="cropModal" class="modal hidden"><div class="modalCard cropCard">
<div class="sectionTitle"><div><h3>画像を切り抜き・編集</h3><small>ドラッグで範囲指定♡</small></div><button id="closeCrop">閉じる</button></div>
<div class="cropViewport"><div id="cropStage"><img id="cropImage"><canvas id="cropOverlay"></canvas></div></div>
<div class="cropSettings">
<label>透明余白 <output id="padOut">0%</output><input id="padding" type="range" min="0" max="100" value="0"></label>
<label>角度 <output id="angleOut">0°</output><input id="angle" type="range" min="-180" max="180" value="0"></label>
</div>
<div class="resultBox"><div>仕上がり確認</div><canvas id="resultCanvas"></canvas></div>
<div class="actions"><span id="cropInfo">範囲未選択</span><button id="resetCrop">リセット</button><button id="applyCrop">適用</button></div>
</div></div>

<script src="site-source.js"></script>
<script src="project-data.js"></script>
<script src="app.js?v=20260922-3"></script>
</body>
</html>
